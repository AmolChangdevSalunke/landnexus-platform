# Isolated PostgreSQL integration test profile.
# Safety: do NOT provide defaults to landnexus_dev. AbstractIsolatedPgIntegrationTest/DynamicPropertySource enforces a disposable DB.
spring.datasource.url=${LANDNEXUS_TEST_DB_URL}
spring.datasource.username=${LANDNEXUS_TEST_DB_USERNAME}
spring.datasource.password=${LANDNEXUS_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.test.database.replace=NONE
