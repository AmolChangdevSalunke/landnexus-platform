# Production logging profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# Console + daily/size-rotated text and JSON Lines files (see logback-spring.xml).
landnexus.logging.environment=prod
landnexus.logging.level.root=INFO
landnexus.logging.level.app=INFO
landnexus.logging.level.framework=WARN
landnexus.logging.level.sql=WARN
# SQL with bound values is noisy and can contain personal data.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
