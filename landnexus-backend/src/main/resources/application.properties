# Application name
spring.application.name=landnexus-backend

# PostgreSQL (secrets come from environment variables, never hardcode them)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/landnexus_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator endpoints
management.endpoints.web.exposure.include=health,info

# Security: JWT (secret must be supplied through the JWT_SECRET environment variable, 32+ characters)
landnexus.jwt.secret=${JWT_SECRET}
landnexus.jwt.issuer=landnexus
landnexus.jwt.access-token-minutes=15
landnexus.jwt.refresh-token-days=7

# Browser origins allowed to call the API (the React dev server by default)
landnexus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# First administrator, created ONLY when the users table is empty. Supply through environment variables.
landnexus.bootstrap.admin.username=${LANDNEXUS_ADMIN_USERNAME:}
landnexus.bootstrap.admin.password=${LANDNEXUS_ADMIN_PASSWORD:}
landnexus.bootstrap.admin.email=${LANDNEXUS_ADMIN_EMAIL:admin@landnexus.local}

# Secure document storage (a folder OUTSIDE the project; set LANDNEXUS_STORAGE_DIR)
landnexus.storage.dir=${LANDNEXUS_STORAGE_DIR}
landnexus.storage.max-file-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# SLA monitoring: the scheduler is OFF unless LANDNEXUS_SLA_SCHEDULER=true (the manual scan always works)
landnexus.sla.scheduler.enabled=${LANDNEXUS_SLA_SCHEDULER:false}
landnexus.sla.scan-interval-ms=900000
landnexus.sla.initial-delay-ms=300000

# Rate limiting (IP based). Failed sign-in style requests are counted per IP; set trust-forwarded-for=true ONLY behind a trusted proxy.
landnexus.ratelimit.enabled=${LANDNEXUS_RATELIMIT_ENABLED:true}
landnexus.ratelimit.auth-failures=${LANDNEXUS_RATELIMIT_AUTH_FAILURES:10}
landnexus.ratelimit.auth-window-seconds=900
landnexus.ratelimit.api-per-minute=${LANDNEXUS_RATELIMIT_API_PER_MINUTE:1200}
landnexus.ratelimit.trust-forwarded-for=${LANDNEXUS_RATELIMIT_TRUST_XFF:false}

# Satellite imagery (OGC WMS, for example ISRO Bhuvan). OFF until you have access: see docs/IMAGERY_SETUP.md
landnexus.imagery.enabled=${LANDNEXUS_IMAGERY_ENABLED:false}
landnexus.imagery.provider-name=${LANDNEXUS_IMAGERY_NAME:ISRO Bhuvan}
landnexus.imagery.base-url=${LANDNEXUS_IMAGERY_URL:}
landnexus.imagery.layers=${LANDNEXUS_IMAGERY_LAYERS:}
landnexus.imagery.overlay-base-url=${LANDNEXUS_IMAGERY_OVERLAY_URL:}
landnexus.imagery.overlay-layers=${LANDNEXUS_IMAGERY_OVERLAY_LAYERS:}
landnexus.imagery.wms-version=${LANDNEXUS_IMAGERY_WMS_VERSION:1.1.1}
landnexus.imagery.image-format=${LANDNEXUS_IMAGERY_FORMAT:image/png}
landnexus.imagery.auth-mode=${LANDNEXUS_IMAGERY_AUTH:NONE}
landnexus.imagery.auth-name=${LANDNEXUS_IMAGERY_AUTH_NAME:token}
landnexus.imagery.auth-secret=${LANDNEXUS_IMAGERY_SECRET:}
landnexus.imagery.attribution=${LANDNEXUS_IMAGERY_ATTRIBUTION:Imagery: ISRO Bhuvan (terms of use apply)}
landnexus.imagery.timeout-seconds=10
landnexus.imagery.max-bytes=5242880
landnexus.imagery.allow-insecure-http=false
