# Application name
spring.application.name=landnexus-backend

# PostgreSQL (secrets come from environment variables, never hardcode them)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/landnexus_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator endpoints
management.endpoints.web.exposure.include=health,info

# Security: JWT (secret must be supplied through the JWT_SECRET environment variable, 32+ characters)
landnexus.jwt.secret=${JWT_SECRET}
landnexus.jwt.issuer=landnexus
landnexus.jwt.access-token-minutes=15
landnexus.jwt.refresh-token-days=7

# Browser origins allowed to call the API (the React dev server by default)
landnexus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# First administrator, created ONLY when the users table is empty. Supply through environment variables.
landnexus.bootstrap.admin.username=${LANDNEXUS_ADMIN_USERNAME:}
landnexus.bootstrap.admin.password=${LANDNEXUS_ADMIN_PASSWORD:}
landnexus.bootstrap.admin.email=${LANDNEXUS_ADMIN_EMAIL:admin@landnexus.local}

# Secure document storage (a folder OUTSIDE the project; set LANDNEXUS_STORAGE_DIR)
landnexus.storage.dir=${LANDNEXUS_STORAGE_DIR}
landnexus.storage.max-file-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# SLA monitoring: the scheduler is OFF unless LANDNEXUS_SLA_SCHEDULER=true (the manual scan always works)
landnexus.sla.scheduler.enabled=${LANDNEXUS_SLA_SCHEDULER:false}
landnexus.sla.scan-interval-ms=900000
landnexus.sla.initial-delay-ms=300000
